name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      - name: Check published types
        run: npm run check:types

      - name: Audit styles
        run: npm run audit:styles

      - name: Check package contents
        run: npm pack --dry-run

  lucide-range:
    name: lucide-react ${{ matrix.lucide-react }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest and the newest version allowed by the dependency range.
        lucide-react: ["0.420.0", "1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install lucide-react ${{ matrix.lucide-react }}
        run: npm install --no-save lucide-react@${{ matrix.lucide-react }} && npm ls lucide-react

      - name: Typecheck
        run: npm run typecheck

      # Browser tests measure styles and positions, which do not depend on the icon version.
      - name: Test
        run: npm test -- --project unit

      - name: Build library
        run: npm run build
