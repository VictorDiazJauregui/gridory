name: Feature request
description: Suggest a new feature or a change to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        English or Spanish are both fine. For bigger changes, let's agree on the approach here
        before anyone writes code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Props, events or markup you have in mind.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - DataTable
        - KanbanBoard
        - AI assistant
        - Auth forms
        - Segmented control
        - Styles and theming
        - New component
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you tried or other ways to solve it.
